name: Application Windows (.exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'installateur et la version portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Conserver les .exe
        uses: actions/upload-artifact@v4
        with:
          name: DiagLab-Pro-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "DiagLab Pro $GITHUB_REF_NAME" --notes-file ../.github/release-notes.md
