name: Application Windows (.exe)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'installateur et la version portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Conserver les .exe
        uses: actions/upload-artifact@v4
        with:
          name: DiagLab-Pro-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Joindre les .exe à la version
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"
